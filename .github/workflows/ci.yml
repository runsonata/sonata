name: CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  # Full build: zlib + zstd + libsodium on every OS.
  # CMakeLists.txt reads these two variables as the default for its options.
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    env:
      SONATA_COMPRESS_ZSTD: "ON"
      SONATA_COMPRESS_CRYPTO: "ON"

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: >
        sudo apt-get update &&
        sudo apt-get install -y
        libssl-dev zlib1g-dev libzstd-dev libsodium-dev pkg-config

    # zlib is provided by the macOS SDK; brew's zlib is keg-only and not needed.
    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: brew install openssl zstd libsodium pkgconf

    - name: Install OpenSSL (Windows)
      if: runner.os == 'Windows'
      run: choco install openssl

    # Static libraries with the dynamic CRT (/MD) to match the rest of the build
    # and to avoid shipping extra DLLs next to sn.exe.
    - name: Install zlib, zstd, libsodium (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        "$VCPKG_INSTALLATION_ROOT/vcpkg.exe" install zlib zstd libsodium --triplet x64-windows-static-md
        echo "CMAKE_PREFIX_PATH=$VCPKG_INSTALLATION_ROOT/installed/x64-windows-static-md" >> "$GITHUB_ENV"

    - name: Build and Run Tests
      run: bash ./b.sh test release
      
    - name: Run Analyze (Linux Only)
      if: runner.os == 'Linux'
      run:  ln -sf "build/release/compile_commands.json" compile_commands.json && bash ./b.sh analyze

  # Minimal build: only the required libraries, so the optional-feature
  # #ifdef paths in the compress library keep compiling without zstd/libsodium.
  build-minimal:
    runs-on: ubuntu-latest

    env:
      SONATA_COMPRESS_ZSTD: "OFF"
      SONATA_COMPRESS_CRYPTO: "OFF"

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y libssl-dev zlib1g-dev

    - name: Build and Run Tests
      run: bash ./b.sh test release