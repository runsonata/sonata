name: CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    # Same libraries as a release: CMakeLists.txt reads these two variables as
    # the default for its options, so the compress backends get tested too.
    env:
      SONATA_COMPRESS_ZSTD: "ON"
      SONATA_COMPRESS_CRYPTO: "ON"

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: >
        sudo apt-get update &&
        sudo apt-get install -y
        libssl-dev zlib1g-dev libzstd-dev libsodium-dev pkg-config
        libmagickwand-dev clang-tidy jq

    # zlib is part of the macOS SDK.
    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: brew install openssl@3 zstd libsodium pkgconf imagemagick

    # Static libraries built for the dynamic CRT (x64-windows-static-md, the
    # triplet b.sh uses by default), so sn.exe and snrt.exe need no DLLs.
    # b.sh finds them through VCPKG_INSTALLATION_ROOT. vcpkg has no
    # ImageMagick, so Windows builds leave the image library out.
    - name: Cache vcpkg packages (Windows)
      if: runner.os == 'Windows'
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/vcpkg-cache
        key: vcpkg-x64-windows-static-md-${{ github.run_id }}
        restore-keys: vcpkg-x64-windows-static-md-

    - name: Install dependencies (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.temp }}/vcpkg-cache
      run: |
        New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
        & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install --triplet x64-windows-static-md openssl zlib zstd libsodium
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Build and Run Tests
      shell: bash
      run: bash ./b.sh test release

    - name: Run Analyze (Linux Only)
      if: runner.os == 'Linux'
      run:  ln -sf "build/release/compile_commands.json" compile_commands.json && bash ./b.sh analyze
