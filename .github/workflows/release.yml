name: Draft Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    env:
      SONATA_COMPRESS_ZSTD: "ON"
      SONATA_COMPRESS_CRYPTO: "ON"

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: >
        sudo apt-get update &&
        sudo apt-get install -y
        libssl-dev zlib1g-dev libzstd-dev libsodium-dev pkg-config

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: brew install openssl zstd libsodium pkgconf

    - name: Install OpenSSL (Windows)
      if: runner.os == 'Windows'
      run: choco install openssl

    - name: Install zlib (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        vcpkg install zlib:x64-windows-static-md
        $zlib = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static-md"
        Copy-Item "$zlib\lib\zs.lib" "$zlib\lib\zlib.lib"
        Copy-Item "$zlib\debug\lib\zsd.lib" "$zlib\debug\lib\zlibd.lib"
        "CMAKE_PREFIX_PATH=$zlib" >> $env:GITHUB_ENV

    - name: Build and package
      shell: bash
      run: bash ./b.sh package

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: sonata-packages-${{ matrix.os }}
        path: |
          build/package/*.tar.gz
          build/package/*.zip
        if-no-files-found: error

  create-release:
    needs: package
    runs-on: ubuntu-latest
    steps:
    - name: Download Artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true

    - name: Create Draft Release
      uses: softprops/action-gh-release@v2
      with:
        draft: true
        generate_release_notes: true
        files: artifacts/*
