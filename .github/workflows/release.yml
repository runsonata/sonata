name: Draft Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    env:
      SONATA_COMPRESS_ZSTD: "ON"
      SONATA_COMPRESS_CRYPTO: "ON"

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        submodules: recursive
        fetch-depth: 0

    # Packages are named after the version in CMakeLists.txt, so a tag that
    # doesn't match it would publish misnamed files.
    - name: Check tag matches project version
      shell: bash
      run: |
        version="$(sed -n 's/^project(sonata VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
        if [[ "${GITHUB_REF_NAME#v}" != "$version" ]]; then
          echo "::error::tag $GITHUB_REF_NAME doesn't match the project version $version in CMakeLists.txt"
          exit 1
        fi

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: >
        sudo apt-get update &&
        sudo apt-get install -y
        libssl-dev zlib1g-dev libzstd-dev libsodium-dev pkg-config

    # zlib is part of the macOS SDK.
    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: brew install openssl@3 zstd libsodium pkgconf

    # Static libraries built for the dynamic CRT (x64-windows-static-md, the
    # triplet b.sh uses by default), so sn.exe and snrt.exe need no DLLs.
    # b.sh finds them through VCPKG_INSTALLATION_ROOT.
    - name: Cache vcpkg packages (Windows)
      if: runner.os == 'Windows'
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/vcpkg-cache
        key: vcpkg-x64-windows-static-md-${{ github.run_id }}
        restore-keys: vcpkg-x64-windows-static-md-

    - name: Install dependencies (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.temp }}/vcpkg-cache
      run: |
        New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
        & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install --triplet x64-windows-static-md openssl zlib zstd libsodium
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Build and package
      shell: bash
      run: bash ./b.sh package

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: sonata-${{ runner.os }}-${{ runner.arch }}
        path: |
          build/package/*.tar.gz
          build/package/*.zip
        if-no-files-found: error

  create-release:
    needs: package
    runs-on: ubuntu-latest
    steps:
    - name: Download Artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true

    - name: Create Draft Release
      uses: softprops/action-gh-release@v2
      with:
        draft: true
        generate_release_notes: true
        files: artifacts/*
